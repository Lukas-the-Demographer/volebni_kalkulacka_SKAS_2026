<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profily kandidátů ASF PřF UK</title>
    <!-- ?v=8: po každé úpravě style.css nebo data.js zvyš číslo (v obou HTML), jinak prohlížeč může použít starou verzi -->
    <link rel="icon" href="ikona.svg" type="image/svg+xml">
    <link rel="icon" href="ikona.png" type="image/png">
    <link rel="apple-touch-icon" href="ikona.png">
    <link rel="stylesheet" href="style.css?v=8">
    <script src="data.js?v=8"></script>
</head>
<body>

<div class="container" id="app"></div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const rozbalId = new URLSearchParams(window.location.search).get('kandidat');
        const appDiv = document.getElementById('app');
        document.body.insertAdjacentHTML('beforeend', paticka());

        const NAZVY_PRIORIT = { 3: 'Priorita', 2: 'Důležité', 1: 'Okrajové' };

        // Řazení: podle pořadí sekcí v data.js (Biologie → Geografie → Chemie → Geologie a ÚŽP),
        // uvnitř sekce v pořadí, v jakém jsou kandidáti zapsaní v data.js.
        const poradiSekci = nazev => sekce.findIndex(s => s.nazev === nazev);
        const serazeni = [...kandidati].sort((a, b) => poradiSekci(a.info.sekce) - poradiSekci(b.info.sekce));

        window.vykresliKandidaty = function(filtr = 'Vse', isFirst = false) {
            let html = isFirst ? `<div class="fade-in">` : `<div>`;
            html += `<a class="nav-box" href="kalkulacka.html" target="_blank">← Volební kalkulačka ↗</a>`;
            html += `<h1>Profily kandidátů</h1>`;
            html += filtrySekci(filtr, 'vykresliKandidaty', true);

            const seznam = filtr === 'Vse' ? serazeni : serazeni.filter(k => k.info.sekce === filtr);
            if (seznam.length === 0) html += `<p style="text-align:center;">V této sekci zatím nikdo nekandiduje.</p>`;

            html += `<div class="kand-grid">`;
            seznam.forEach(k => html += k.id === rozbalId ? rozbalenaKarta(k) : malaKarta(k));
            html += `</div></div>`;
            appDiv.innerHTML = html;

            if (rozbalId && isFirst) {
                setTimeout(() => {
                    const el = document.getElementById('card-' + rozbalId);
                    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }, 100);
            }
        };

        // Fotka, nebo iniciály, když fotka chybí
        function fotka(k) {
            const inicialy = k.jmeno.split(' ').map(n => n[0]).join('');
            return `<div class="kand-photo-placeholder">${k.foto ? `<img src="${k.foto}" alt="${k.jmeno}" loading="lazy">` : inicialy}</div>`;
        }

        // Sbalená karta – 4 řádky: jméno, obor, ročník, odkaz na program. Kliknutím (mimo odkaz) se otevře profil.
        function malaKarta(k) {
            return `
                <div class="kand-box" id="card-${k.id}" onclick="otevriKandidata('${k.id}')">
                    ${fotka(k)}
                    <div class="badge ${sekceTrida(k.info.sekce)}">${k.info.sekce}</div>
                    <h3 class="karta-jmeno">${k.jmeno}</h3>
                    <div class="karta-radek">${k.info.obor || '&nbsp;'}</div>
                    <div class="karta-radek">${k.info.rocnik || '&nbsp;'}</div>
                    <div class="karta-radek">${k.info.odkaz ? `<a href="${k.info.odkaz}" target="_blank" onclick="event.stopPropagation()">Program (PDF) ↗</a>` : '&nbsp;'}</div>
                </div>`;
        }

        // Rozbalená karta – všechno o kandidátovi; na kliknutí nereaguje, zavírá se jen tlačítkem
        function rozbalenaKarta(k) {
            const zpet = `<button class="submit-btn back-btn" onclick="zpetNaSeznam()">← Zpět na seznam kandidátů</button>`;
            const kom = k.komentare || {};
            const radky = [];
            if (k.info.obor || k.info.rocnik) radky.push(`<strong>Obor:</strong> ${k.info.obor}${k.info.rocnik ? ` (${k.info.rocnik})` : ''}`);
            if (k.info.kontakt) radky.push(`<strong>Kontakt:</strong> <a href="mailto:${k.info.kontakt}" style="color:var(--cyan);">${k.info.kontakt}</a>`);
            if (k.info.odkaz) radky.push(`<strong>Program a životopis:</strong> <a href="${k.info.odkaz}" target="_blank" style="color:var(--yellow);">Otevřít PDF ↗</a>`);

            let html = `
                <div class="kand-box expanded" id="card-${k.id}">
                    ${zpet}
                    <div class="kand-header">
                        ${fotka(k)}
                        <div style="flex:1;">
                            <div class="badge ${sekceTrida(k.info.sekce)}">${k.info.sekce}</div>
                            <h3 style="margin: 5px 0;">${k.jmeno}</h3>
                            <div style="font-size: 13px; color: #aaa; line-height: 1.4;">${radky.join('<br>')}</div>
                        </div>
                    </div>
                    <div class="kand-detail-content">`;

            if (!maPlnePriority(k)) {
                html += `<div class="instruction-box">Kandidát nevyplnil všechny priority, a proto není zahrnut ve výsledcích kalkulačky.</div>`;
            }

            // Levý sloupec: otázky Ano/Ne s odpovědí a případným zdůvodněním
            html += `<div class="profil-grid"><div><h4>Otázky Ano/Ne</h4>`;
            otazky.forEach(o => {
                const v = k.odpovedi[o.id];
                const odp = v === 1 ? `<span class="odp odp-ano">Ano</span>` : v === -1 ? `<span class="odp odp-ne">Ne</span>` : `<span class="odp">Neodpověděl/a</span>`;
                html += `<div class="profil-polozka"><div class="qa-q">${o.text}</div>${kontextHtml(o)}${odp}${kom[o.id] ? `<div class="qa-a">${kom[o.id]}</div>` : ''}</div>`;
            });
            html += `</div>`;

            // Pravý sloupec: priority od nejvyšší, uvnitř úrovně podle abecedy
            html += `<div><h4>Priority</h4>`;
            const serazeneOblasti = oblasti
                .map(o => ({ ...o, u: (k.priority || {})[o.id] || 0 }))
                .sort((a, b) => b.u - a.u || a.text.localeCompare(b.text, 'cs'));
            serazeneOblasti.forEach(o => {
                const stitek = o.u ? NAZVY_PRIORIT[o.u] : 'Nevyplněno';
                html += `<div class="profil-polozka prio-${o.u}"><div class="prio-hlava"><span class="prio-stitek">${stitek}</span>${o.text}</div>${popisOblastiHtml(o)}${kom[o.id] ? `<div class="qa-a">${kom[o.id]}</div>` : ''}</div>`;
            });
            html += `</div></div>`;

            // Pod tím: nepříjemné otázky
            html += `<h4>Nepříjemné otázky na tělo</h4>`;
            const zodpovezene = neprijemneOtazky.filter(n => k.neprijemne && k.neprijemne[n.id]);
            zodpovezene.forEach(n => html += `<div class="qa-block"><div class="qa-q">${n.text}</div><div class="qa-a">${k.neprijemne[n.id]}</div></div>`);
            if (zodpovezene.length === 0) html += `<div class="qa-a">Žádné odpovědi v této sekci.</div>`;

            return html + `</div>${zpet}</div>`;
        }

        window.otevriKandidata = id => window.location.href = 'kandidati.html?kandidat=' + id;
        window.zpetNaSeznam = () => window.location.href = 'kandidati.html';

        vykresliKandidaty('Vse', true);
    });
</script>
</body>
</html>
