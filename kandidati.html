<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profily kandidátů AS PřF UK</title>
    <link rel="stylesheet" href="style.css">
    <script src="data.js"></script>
</head>
<body>

<div class="container" id="app"></div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const rozbalId = new URLSearchParams(window.location.search).get('kandidat');
        const appDiv = document.getElementById('app');

        // Kandidáti se NEŘADÍ – zobrazují se v pořadí, v jakém jsou zapsaní v data.js.

        window.vykresliKandidaty = function(filtr = 'Vse', isFirst = false) {
            let html = isFirst ? `<div class="fade-in">` : `<div>`;
            html += `<h1>Profily kandidátů</h1>`;
            if (rozbalId) {
                html += `<p style="text-align:center; color:#888; font-size:12px;">(Zavřením této záložky se vrátíte do kalkulačky)</p>`;
            }
            html += filtrySekci(filtr, 'vykresliKandidaty', true);

            const seznam = filtr === 'Vse' ? kandidati : kandidati.filter(k => k.info.sekce === filtr);
            if (seznam.length === 0) html += `<p style="text-align:center;">V této sekci zatím nikdo nekandiduje.</p>`;

            html += `<div class="kand-grid">`;
            seznam.forEach(k => html += k.id === rozbalId ? rozbalenaKarta(k) : malaKarta(k));
            html += `</div></div>`;
            appDiv.innerHTML = html;

            if (rozbalId && isFirst) {
                setTimeout(() => {
                    const el = document.getElementById('card-' + rozbalId);
                    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }, 100);
            }
        };

        function inicialy(k) { return k.jmeno.split(' ').map(n => n[0]).join(''); }

        // Sbalená karta – kliknutím se otevře profil
        function malaKarta(k) {
            return `
                <div class="kand-box" id="card-${k.id}" onclick="otevriKandidata('${k.id}')">
                    <div class="kand-photo-placeholder">${inicialy(k)}</div>
                    <div class="badge ${sekceTrida(k.info.sekce)}">${k.info.sekce}</div>
                    <h3 style="margin: 5px 0;">${k.jmeno}</h3>
                </div>`;
        }

        // Rozbalená karta – na kliknutí nereaguje, zavírá se jen tlačítkem
        function rozbalenaKarta(k) {
            const zpet = `<button class="submit-btn back-btn" onclick="zpetNaSeznam()">← Zpět na seznam kandidátů</button>`;
            let html = `
                <div class="kand-box expanded" id="card-${k.id}">
                    ${zpet}
                    <div class="kand-header">
                        <div class="kand-photo-placeholder">${inicialy(k)}</div>
                        <div style="flex:1;">
                            <div class="badge ${sekceTrida(k.info.sekce)}">${k.info.sekce}</div>
                            <h3 style="margin: 5px 0;">${k.jmeno}</h3>
                            <div style="font-size: 13px; color: #aaa; line-height: 1.4;">
                                <strong>Obor:</strong> ${k.info.obor} (${k.info.rocnik}) <br>
                                <strong>Kontakt:</strong> <a href="mailto:${k.info.kontakt}" style="color:var(--cyan);">${k.info.kontakt}</a> <br>
                                <strong>Program/CV:</strong> <a href="${k.info.odkaz}" target="_blank" style="color:var(--yellow);">Zobrazit web</a>
                            </div>
                        </div>
                    </div>
                    <div class="kand-detail-content">
                        <h4>Komentáře k anketě</h4>`;

            const komentovane = otazky.concat(oblasti).filter(p => k.komentare && k.komentare[p.id]);
            komentovane.forEach(p => html += qaBlok(p.text, k.komentare[p.id]));
            if (komentovane.length === 0) html += `<div class="qa-a">Kandidát nevyplnil žádné doplňující komentáře.</div>`;

            html += `<h4>Nepříjemné otázky na tělo</h4>`;
            (k.neprijemneOtazky || []).forEach(qa => html += qaBlok(qa.q, qa.a));
            if (!k.neprijemneOtazky || k.neprijemneOtazky.length === 0) html += `<div class="qa-a">Žádné odpovědi v této sekci.</div>`;

            return html + `</div>${zpet}</div>`;
        }

        function qaBlok(otazka, odpoved) {
            return `<div class="qa-block"><div class="qa-q">${otazka}</div><div class="qa-a">${odpoved}</div></div>`;
        }

        window.otevriKandidata = id => window.location.href = 'kandidati.html?kandidat=' + id;
        window.zpetNaSeznam = () => window.location.href = 'kandidati.html';

        vykresliKandidaty('Vse', true);
    });
</script>
</body>
</html>
