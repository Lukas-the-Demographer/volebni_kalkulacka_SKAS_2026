<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volby do SKASu PřF UK 2026</title>
    <!-- ?v=15: po každé úpravě style.css nebo data.js zvyš číslo (ve všech HTML), jinak prohlížeč může použít starou verzi -->
    <link rel="icon" href="ikona.svg" type="image/svg+xml">
    <link rel="icon" href="ikona.png" type="image/png">
    <link rel="apple-touch-icon" href="ikona.png">
    <link rel="stylesheet" href="style.css?v=15">
    <script src="data.js?v=15"></script>
</head>
<body>

<div class="container" id="app"></div>

<script>
    document.addEventListener("DOMContentLoaded", () => {

        // Rachejtle při kliknutí
        document.addEventListener('click', function(e) {
            const colors = ['#00d2ff', '#ff007f', '#ffdf00', '#39ff14'];
            for (let i = 0; i < 10; i++) {
                let spark = document.createElement('div');
                spark.className = 'spark';
                spark.style.left = e.clientX + 'px';
                spark.style.top = e.clientY + 'px';
                spark.style.background = colors[Math.floor(Math.random() * colors.length)];
                let angle = (i / 10) * Math.PI * 2;
                let velocity = 30 + Math.random() * 40;
                spark.style.setProperty('--dx', Math.cos(angle) * velocity + 'px');
                spark.style.setProperty('--dy', Math.sin(angle) * velocity + 'px');
                document.body.appendChild(spark);
                setTimeout(() => spark.remove(), 600);
            }
        });

        const appDiv = document.getElementById('app');
        document.body.insertAdjacentHTML('beforeend', paticka());

        function vykresliIntro() {
            appDiv.innerHTML = `
                <div class="intro-screen fade-in">
                    <div class="intro-q">Chceš, aby naše přírodověda vzkvétala?</div>
                    <button class="submit-btn" style="width:auto; padding: 15px 40px;" id="startBtn">Chci</button>
                </div>`;
            document.getElementById('startBtn').addEventListener('click', vykresliMenu);
        }

        function vykresliMenu() {
            appDiv.innerHTML = `
                <div class="intro-screen fade-in">
                    <div class="intro-msg">Tak to jsi tu správně.</div>
                    <div style="color: #888; font-size: 13px;">Volby do SKASu · 24.–26. 11. 2026 · Vyber si, co tě zajímá:</div>
                    <div class="menu-grid">
                        <a href="kalkulacka.html" class="menu-square alt">Spustit kalkulačku</a>
                        <a href="kandidati.html" class="menu-square">Profily kandidátů</a>
                        <a href="o-kalkulacce.html" class="menu-square tret">Proč to celé?</a>
                    </div>
                    <a class="intro-volit" href="o-kalkulacce.html#jak-volit">Víš, že máš při volbě víc hlasů? Jak volit →</a>
                    <div class="intro-pozn">Nezávislá studentská iniciativa. Nejde o oficiální nástroj SKAS ani Akademického senátu PřF UK.</div>
                </div>`;
        }

        vykresliIntro();
    });
</script>
</body>
</html>
