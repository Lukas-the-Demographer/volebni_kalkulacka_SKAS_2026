<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volební kalkulačka do AS PřF UK (Y2K Edition)</title>
    <!-- Retro pixelový font -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan: #00FFFF;
            --magenta: #FF00FF;
            --yellow: #FFFF00;
            --black: #000000;
            --white: #FFFFFF;
        }

        body { 
            font-family: 'Press Start 2P', monospace; 
            background-color: var(--black); 
            color: var(--cyan); 
            line-height: 1.8; 
            padding: 20px; 
            font-size: 10px;
            text-transform: uppercase;
        }

        .cmyk-seizure { animation: flash 0.1s infinite; }
        @keyframes flash {
            0% { background-color: var(--black); color: var(--magenta); }
            33% { background-color: var(--cyan); color: var(--black); }
            66% { background-color: var(--magenta); color: var(--yellow); }
            100% { background-color: var(--yellow); color: var(--black); }
        }

        .blink { animation: blinker 1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }

        .container { 
            max-width: 650px; 
            margin: 0 auto; 
            background: var(--black); 
            padding: 20px; 
            border: 4px solid var(--magenta); 
            box-shadow: 10px 10px 0px var(--cyan); 
            min-height: 200px;
        }

        h1, h2, h3 { color: var(--yellow); text-align: center; text-shadow: 2px 2px var(--magenta); line-height: 1.5; }
        h1 { font-size: 18px; margin-bottom: 30px; }
        
        .card { border: 2px solid var(--cyan); padding: 15px; margin-bottom: 20px; background: #0a0a0a; }
        .options { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
        
        button { 
            font-family: 'Press Start 2P', monospace; 
            flex: 1; padding: 12px; border: 2px solid; background: transparent; 
            cursor: pointer; text-transform: uppercase; font-size: 10px; transition: all 0.1s;
        }

        .btn-ano { color: var(--cyan); border-color: var(--cyan); }
        .btn-ano:hover, .btn-ano.selected { background-color: var(--cyan); color: var(--black); }
        .btn-ne { color: var(--magenta); border-color: var(--magenta); }
        .btn-ne:hover, .btn-ne.selected { background-color: var(--magenta); color: var(--black); }
        .btn-nevim { color: var(--yellow); border-color: var(--yellow); }
        .btn-nevim:hover, .btn-nevim.selected { background-color: var(--yellow); color: var(--black); }

        .btn-prio { color: var(--magenta); border-color: var(--magenta); }
        .btn-prio:hover, .btn-prio.selected { background-color: var(--magenta); color: var(--black); }
        .btn-mid { color: var(--cyan); border-color: var(--cyan); }
        .btn-mid:hover, .btn-mid.selected { background-color: var(--cyan); color: var(--black); }
        .btn-low { color: var(--white); border-color: var(--white); }
        .btn-low:hover, .btn-low.selected { background-color: var(--white); color: var(--black); }

        .submit-btn { background-color: transparent; color: var(--yellow); border: 4px solid var(--yellow); width: 100%; padding: 15px; font-size: 12px; margin-top: 20px; }
        .submit-btn:hover { background-color: var(--yellow); color: var(--black); box-shadow: inset 0 0 0 3px var(--black); }
        
        .match-bar { border: 2px solid var(--white); background: var(--black); margin: 15px 0; height: 20px; padding: 2px; }
        .match-fill { background: var(--magenta); height: 100%; transition: width 0.5s; }
        
        .counter-box { position: sticky; top: 0; background: var(--black); padding: 10px; border-bottom: 2px solid var(--cyan); margin-bottom: 20px; text-align: center; z-index: 100; }
        .counter { display: inline-block; padding: 5px; margin: 5px; border: 2px solid; }
        .counter.ok { border-color: var(--cyan); color: var(--cyan); }
        .counter.err { border-color: var(--magenta); color: var(--magenta); animation: blinker 0.5s linear infinite; }
        
        .detail-btn { border-color: var(--cyan); color: var(--cyan); width: 100%; margin-top: 10px; }
        .detail-item { padding: 10px 0; border-bottom: 2px dashed #333; font-size: 9px; line-height: 1.5; }
        
        .intro-screen { text-align: center; padding: 50px 20px; }
        .intro-q { font-size: 18px; color: var(--yellow); line-height: 1.8; margin-bottom: 50px; }
        .intro-btn { font-size: 24px; color: var(--cyan); border: 6px solid var(--cyan); padding: 20px; width: 80%; }
        .intro-btn:hover { background: var(--cyan); color: var(--black); }
        .intro-msg { font-size: 28px; font-weight: bold; margin-top: 80px; }
    </style>
</head>
<body>

<div class="container" id="app">
    <div style="text-align: center; padding: 50px; color: var(--cyan);" class="blink">
        [ NAHRÁVÁM SYSTÉM... ]
    </div>
</div>

<script>
    // Pojistka, že se script spustí až po načtení prvků stránky
    document.addEventListener("DOMContentLoaded", () => {
        
        const limitPriorit = 2; // ZMĚŇ NA 5, AŽ BUDEŠ MÍT 15 OBLASTÍ

        const otazky = [
            { id: 'q1', text: 'Měly by se přednášky povinně nahrávat?' },
            { id: 'q2', text: 'Jste pro zavedení elektronického indexu?' }
        ];

        const oblasti = [
            { id: 'o1', text: 'Reforma doktorského studia' },
            { id: 'o2', text: 'Dotování menzy a bufetů' },
            { id: 'o3', text: 'Zahraniční výjezdy a Erasmus' },
            { id: 'o4', text: 'Podpora studentských spolků' },
            { id: 'o5', text: 'Ekologizace provozu fakulty' },
            { id: 'o6', text: 'Opravy a vybavení laboratoří' }
        ];

        const kandidati = [
            { jmeno: 'Jan Novák', odpovedi: { q1: 1, q2: -1 }, priority: { o1: 3, o2: 3, o3: 2, o4: 2, o5: 1, o6: 1 } },
            { jmeno: 'Petra Svobodová', odpovedi: { q1: 1, q2: 1 }, priority: { o1: 1, o2: 1, o3: 2, o4: 2, o5: 3, o6: 3 } }
        ];

        let uzivOdpovedi = {};
        let uzivPriority = {};
        const appDiv = document.getElementById('app');

        function vykresliIntro() {
            appDiv.innerHTML = `
                <div class="intro-screen">
                    <div class="intro-q blink">CHCEŠ, ABY NAŠE PŘÍRODOVĚDA VZKVÉTALA?</div>
                    <button class="intro-btn" id="startBtn">CHCI</button>
                </div>
            `;
            // Přidání event listeneru bezpečněji
            document.getElementById('startBtn').addEventListener('click', spustAnimaci);
        }

        function spustAnimaci() {
            document.body.classList.add('cmyk-seizure');
            appDiv.innerHTML = `
                <div class="intro-screen">
                    <div class="intro-msg">TAK TO SEŠ<br><br>TU SPRÁVNĚ!</div>
                </div>
            `;
            setTimeout(() => {
                document.body.classList.remove('cmyk-seizure');
                vykresliFormular();
            }, 1500);
        }

        // Globální funkce (aby fungovaly z onclick v HTML)
        window.odpovezOtazku = function(id, val) { uzivOdpovedi[id] = val; vykresliFormular(); };
        window.odpovezPrioritu = function(id, val) { uzivPriority[id] = val; vykresliFormular(); };
        window.zkontrolujAVyhodnot = function() {
            const pocty = spocitejPriority();
            if (pocty.p3 !== limitPriorit || pocty.p2 !== limitPriorit || pocty.p1 !== limitPriorit) {
                alert(`SYSTEM ERROR: Označ přesně ${limitPriorit}x MAX, ${limitPriorit}x MID a ${limitPriorit}x LOW.`);
                return;
            }
            
            let vysledky = kandidati.map(kand => {
                let maxBodu = 0, ziskaneBody = 0, detaily = [];

                otazky.forEach(o => {
                    const u = uzivOdpovedi[o.id];
                    const k = kand.odpovedi[o.id];
                    if (u === 1 || u === -1) {
                        maxBodu += 2;
                        let jeShoda = (u === k);
                        if (jeShoda) ziskaneBody += 2;
                        detaily.push({
                            typ: 'otazka', text: o.text,
                            uTxt: u === 1 ? 'ANO' : 'NE',
                            kTxt: k === 1 ? 'ANO' : (k === -1 ? 'NE' : 'SKIP'),
                            body: jeShoda ? 2 : 0
                        });
                    }
                });

                oblasti.forEach(o => {
                    const u = uzivPriority[o.id];
                    const k = kand.priority[o.id];
                    maxBodu += 2; 
                    let bodyZaObl = 2 - Math.abs(u - k);
                    ziskaneBody += bodyZaObl;
                    const nazvy = {3: 'MAX', 2: 'MID', 1: 'LOW'};
                    detaily.push({
                        typ: 'priorita', text: o.text,
                        uTxt: nazvy[u], kTxt: nazvy[k], body: bodyZaObl
                    });
                });

                const procento = maxBodu > 0 ? Math.round((ziskaneBody / maxBodu) * 100) : 0;
                return { jmeno: kand.jmeno, procento, detaily };
            });

            vysledky.sort((a, b) => b.procento - a.procento);
            vykresliVysledky(vysledky);
        };
        
        window.vykresliFormular = function() {
            const pocty = spocitejPriority();
            let html = `<h1>AS PřF UK - MISSION START</h1>`;
            
            html += `<h2>[ LEVEL 1: ANO/NE ]</h2>`;
            otazky.forEach(o => {
                const z = uzivOdpovedi[o.id];
                html += `
                    <div class="card">
                        <p>> ${o.text}</p>
                        <div class="options">
                            <button class="btn-ano ${z === 1 ? 'selected' : ''}" onclick="odpovezOtazku('${o.id}', 1)">Ano</button>
                            <button class="btn-ne ${z === -1 ? 'selected' : ''}" onclick="odpovezOtazku('${o.id}', -1)">Ne</button>
                            <button class="btn-nevim ${z === 0 ? 'selected' : ''}" onclick="odpovezOtazku('${o.id}', 0)">Nevím</button>
                        </div>
                    </div>`;
            });

            html += `<h2>[ LEVEL 2: PRIORITY ]</h2>`;
            html += `<p style="text-align:center; color: var(--magenta);">TARGET: ${limitPriorit} OD KAŽDÉHO</p>`;
            
            html += `
                <div class="counter-box">
                    <span class="counter ${pocty.p3 === limitPriorit ? 'ok' : 'err'}">Prio: ${pocty.p3}/${limitPriorit}</span>
                    <span class="counter ${pocty.p2 === limitPriorit ? 'ok' : 'err'}">Mid: ${pocty.p2}/${limitPriorit}</span>
                    <span class="counter ${pocty.p1 === limitPriorit ? 'ok' : 'err'}">Low: ${pocty.p1}/${limitPriorit}</span>
                </div>`;

            oblasti.forEach(o => {
                const z = uzivPriority[o.id];
                html += `
                    <div class="card">
                        <p>> ${o.text}</p>
                        <div class="options">
                            <button class="btn-prio ${z === 3 ? 'selected' : ''}" onclick="odpovezPrioritu('${o.id}', 3)">MAX</button>
                            <button class="btn-mid ${z === 2 ? 'selected' : ''}" onclick="odpovezPrioritu('${o.id}', 2)">MID</button>
                            <button class="btn-low ${z === 1 ? 'selected' : ''}" onclick="odpovezPrioritu('${o.id}', 1)">LOW</button>
                        </div>
                    </div>`;
            });

            html += `<button class="submit-btn" onclick="zkontrolujAVyhodnot()">>>> VYHODNOTIT <<<</button>`;
            appDiv.innerHTML = html;
        };

        window.zobrazDetail = function(idx) {
            const v = window[`kandData_${idx}`];
            let html = `<button class="submit-btn" style="padding: 10px; margin-bottom: 20px;" onclick="zkontrolujAVyhodnot()"><<< BACK</button>
                        <h2 style="color: var(--cyan); text-shadow: none;">DATA LOG: ${v.jmeno}</h2>`;

            html += `<h3 style="text-align: left; color: var(--magenta);">[ LEVEL 1 ]</h3>`;
            v.detaily.filter(d => d.typ === 'otazka').forEach(d => {
                html += `<div class="detail-item">
                            <div style="margin-bottom: 5px; color: var(--white);">> ${d.text}</div>
                            <div style="color: ${d.body === 2 ? 'var(--cyan)' : 'var(--magenta)'};">
                                PLAYER: ${d.uTxt} | NPC: ${d.kTxt}
                            </div>
                         </div>`;
            });

            html += `<h3 style="text-align: left; color: var(--magenta); margin-top: 20px;">[ LEVEL 2 ]</h3>`;
            v.detaily.filter(d => d.typ === 'priorita').forEach(d => {
                let barva = d.body === 2 ? 'var(--cyan)' : (d.body === 1 ? 'var(--yellow)' : 'var(--magenta)');
                html += `<div class="detail-item">
                            <div style="margin-bottom: 5px; color: var(--white);">> ${d.text}</div>
                            <div style="color: ${barva};">
                                PLAYER: ${d.uTxt} | NPC: ${d.kTxt}
                            </div>
                         </div>`;
            });
            
            appDiv.innerHTML = html;
        };

        window.vykresliVysledky = function(vysledky) {
            let html = `<h1>[ MISSION COMPLETED ]</h1>`;
            
            vysledky.forEach((v, idx) => {
                window[`kandData_${idx}`] = v; 
                html += `
                    <div class="card">
                        <h3 style="text-align: left; color: var(--cyan); text-shadow: none;">${v.jmeno} <span style="float:right">${v.procento}%</span></h3>
                        <div class="match-bar"><div class="match-fill" style="width: ${v.procento}%"></div></div>
                        <button class="detail-btn" onclick="zobrazDetail(${idx})">DATA LOG</button>
                    </div>`;
            });
            
            html += `<button class="submit-btn" style="border-color: var(--white); color: var(--white);" onclick="vykresliFormular()">[ RESTART MISSION ]</button>`;
            appDiv.innerHTML = html;
        };

        function spocitejPriority() {
            let p3 = 0, p2 = 0, p1 = 0;
            Object.values(uzivPriority).forEach(v => {
                if(v === 3) p3++;
                if(v === 2) p2++;
                if(v === 1) p1++;
            });
            return { p3, p2, p1 };
        }

        // Start
        vykresliIntro();
    });
</script>
</body>
</html>
